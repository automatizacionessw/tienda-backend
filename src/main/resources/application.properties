# Configuracion base versionada. NO escribir credenciales ni tokens aqui.
#
# Cada valor dependiente del entorno se lee de una variable de entorno
# (${VARIABLE:valor-por-defecto}); los defaults son seguros para produccion.
# - Desarrollo: copia application-local.properties.example a
#   application-local.properties (ignorado por git) y haz ahi tus overrides.
# - Docker/Dokploy: las variables se definen en docker/.env (ver docker/README.md).

spring.application.name=tienda-backend

# Override local del desarrollador: se carga solo si existe y tiene prioridad
# sobre este archivo.
spring.config.import=optional:classpath:application-local.properties

# Base de datos (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tienda_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Bot de Telegram
# Deshabilitado por defecto: un token admite un solo consumidor, asi que se
# habilita de forma explicita y con un bot distinto por entorno (dev/prod).
telegram.bot.habilitado=${TELEGRAM_BOT_ENABLED:false}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
# POLLING (no requiere URL publica) o WEBHOOK (requiere HTTPS publico)
telegram.bot.modo=${TELEGRAM_BOT_MODE:POLLING}
# Solo en modo WEBHOOK: URL publica completa del endpoint POST /telegram/webhook
# y secret (1-256 caracteres A-Z a-z 0-9 _ -) que Telegram envia en cada peticion
telegram.bot.webhook.url=${TELEGRAM_WEBHOOK_URL:}
telegram.bot.webhook.secret=${TELEGRAM_WEBHOOK_SECRET:}

# Almacenamiento de archivos (notas de voz del bot)
almacenamiento.local.directorio=${STORAGE_DIR:./data/archivos}

# Documentacion de la API (OpenAPI / Swagger UI)
# Una sola variable controla ambas propiedades: sin la especificacion la
# interfaz carga vacia. Apagada por defecto porque la API no tiene autenticacion.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
